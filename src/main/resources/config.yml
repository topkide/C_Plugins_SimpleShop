# ══════════════════════════════════════════════════════════════════
#  SimpleShop 설정 파일
#
#  · 모든 텍스트는 & 색상코드를 지원합니다.  (예: &a초록색, &c빨간색, &l굵게)
#  · 헥스(RGB) 색상도 지원합니다.           (예: &#FFAA00주황색)
#  · 수정 후 게임 내에서 /상점관리 리로드 를 입력하면 바로 적용됩니다.
#
#  [플러그인 사용법 요약]
#  · 유저   : /상점 → 좌클릭 구매 1개 / 우클릭 판매 1개
#             쉬프트+좌클릭 대량 구매 / 쉬프트+우클릭 대량 판매
#  · 관리자 : /상점관리 설정 → 1~4번 줄에 인벤토리의 아이템을 집어 놓으면 상품 등록
#             (원본 아이템은 사라지지 않고 복사 등록됩니다)
#             배치된 상품 클릭 = 위치 이동 / 쉬프트+클릭 = 가격 설정 / Q키 = 상품 제거
#             /상점관리 페이지 <번호> = 상점 최대 페이지 설정
# ══════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────
# UI 제목 설정
#   {page} = 현재 페이지 번호,  {max} = 최대 페이지 수
# ──────────────────────────────────────────────
gui:
  # /상점 으로 열리는 유저용 상점 UI 제목
  shop-title: "&8[ &6상점 &8] &7( {page} / {max} 페이지 )"

  # /상점관리 설정 으로 열리는 관리자 편집 UI 제목
  editor-title: "&8[ &c상점 편집 &8] &7( {page} / {max} 페이지 )"

  # 상품 쉬프트+클릭 시 열리는 상품 설정 UI 제목
  item-editor-title: "&8[ &c상품 설정 &8]"

  # 가격이 -1(비활성)일 때 가격 대신 표시할 문구
  price-disabled: "&c불가"

  # UI 빈 칸을 채우는 유리판 종류 (마인크래프트 아이템 ID)
  filler-material: GRAY_STAINED_GLASS_PANE

# ──────────────────────────────────────────────
# 하단 버튼 설정 (유저 상점 / 관리자 편집 UI 공용)
#   material = 버튼 아이템 종류 (PLAYER_HEAD 로 하면 본인 머리로 표시됩니다)
#   사용 가능한 치환 문자: {page} {max} {player} {money}
# ──────────────────────────────────────────────
buttons:
  # 이전 페이지 버튼 (1페이지에서는 표시되지 않습니다)
  prev-page:
    material: ARROW
    name: "&e◀ 이전 페이지"
    lore:
      - "&7클릭하면 {page}페이지에서 이전 페이지로 이동합니다."

  # 다음 페이지 버튼 (마지막 페이지에서는 표시되지 않습니다)
  next-page:
    material: ARROW
    name: "&e다음 페이지 ▶"
    lore:
      - "&7클릭하면 {page}페이지에서 다음 페이지로 이동합니다."

  # 가운데 내 정보 버튼 (보유 금액 표시)
  info:
    material: PLAYER_HEAD
    name: "&f{player} &7님의 정보"
    lore:
      - "&7보유 금액 : &6{money}원"

# ──────────────────────────────────────────────
# 상품 설정 UI 버튼 (관리자용)
#   {price} = 현재 설정된 가격 (-1 이면 위의 price-disabled 문구로 표시)
# ──────────────────────────────────────────────
item-editor:
  # 구매 가격 설정 버튼
  buy-button:
    material: GOLD_INGOT
    name: "&6구매 가격 : &f{price}"
    lore:
      - "&7유저가 이 상품을 &6구매&7할 때의 1개당 가격입니다."
      - "&7클릭하면 채팅으로 가격을 입력할 수 있습니다."
      - "&c-1 을 입력하면 구매가 불가능해집니다. (판매 전용 상품)"

  # 판매 가격 설정 버튼
  sell-button:
    material: EMERALD
    name: "&a판매 가격 : &f{price}"
    lore:
      - "&7유저가 이 상품을 &a판매&7할 때의 1개당 가격입니다."
      - "&7클릭하면 채팅으로 가격을 입력할 수 있습니다."
      - "&c-1 을 입력하면 판매가 불가능해집니다. (구매 전용 상품)"

# ──────────────────────────────────────────────
# 유저 상점에서 상품 아래에 붙는 설명(로어)
#   header → 가격 정보 → footer 순서로 표시됩니다.
#   {buy} = 구매 가격, {sell} = 판매 가격, {bulk} = 대량 거래 수량
#   구매/판매가 비활성(-1)이면 buy-disabled / sell-disabled 줄이 대신 표시됩니다.
# ──────────────────────────────────────────────
shop-item-lore:
  header:
    - "&8&m──────────────────"
  buy: "&7구매 가격 &6{buy}원 &8(1개당)"
  buy-disabled: "&c구매할 수 없는 상품입니다."
  sell: "&7판매 가격 &a{sell}원 &8(1개당)"
  sell-disabled: "&c판매할 수 없는 상품입니다."
  footer:
    - "&8&m──────────────────"
    - "&e좌클릭 &7─ 1개 구매    &e쉬프트+좌클릭 &7─ {bulk}개 구매"
    - "&e우클릭 &7─ 1개 판매    &e쉬프트+우클릭 &7─ {bulk}개 판매"

# ──────────────────────────────────────────────
# 관리자 편집 UI에서 상품 아래에 붙는 설명(로어)
#   {buy} = 구매 가격, {sell} = 판매 가격
# ──────────────────────────────────────────────
editor-item-lore:
  - "&8&m──────────────────"
  - "&7구매 가격 &6{buy} &8/ &7판매 가격 &a{sell}"
  - "&e클릭 &7─ 위치 이동 (빈 칸에 놓기, 다른 상품과 자리 교환)"
  - "&e쉬프트+클릭 &7─ 가격 설정"
  - "&eQ키 &7─ 상품 제거"

# ──────────────────────────────────────────────
# 기타 설정
# ──────────────────────────────────────────────
settings:
  # 쉬프트+클릭으로 한 번에 거래할 수량 (기본 64개)
  bulk-amount: 64

  # 가격 채팅 입력 대기 시간 (초).
  # 이 시간이 지나면 입력이 자동 취소되어, 이후의 일반 채팅이 가격으로 오인되지 않습니다.
  input-timeout-seconds: 60

# ──────────────────────────────────────────────
# 메시지 설정
#   {item} = 아이템 이름, {amount} = 수량, {price} = 금액, {count} = 개수
# ──────────────────────────────────────────────
messages:
  # 모든 메시지 앞에 붙는 말머리
  prefix: "&8[&6상점&8] &f"

  no-permission: "&c권한이 없습니다."

  # ── 거래 메시지 ──
  bought: "&e{item} &f{amount}개&7를 &6{price}원&7에 구매했습니다."
  sold: "&e{item} &f{amount}개&7를 &a{price}원&7에 판매했습니다."
  cannot-buy: "&c구매할 수 없는 상품입니다."
  cannot-sell: "&c판매할 수 없는 상품입니다."
  no-money: "&c돈이 부족합니다. &7(필요 금액: &6{price}원&7)"
  no-space: "&c인벤토리에 공간이 부족합니다."
  no-items: "&c판매할 아이템이 없습니다."

  # ── 관리자 편집 메시지 ──
  item-registered: "&a상품을 등록했습니다. &7(쉬프트+클릭으로 가격을 설정하세요. 등록 직후에는 구매/판매 모두 비활성 상태입니다)"
  item-removed: "&c상품을 제거했습니다."
  slot-occupied: "&c이미 상품이 있는 칸입니다. 빈 칸에 놓아주세요."
  input-buy-price: "&e구매 가격을 채팅으로 입력하세요. &7(-1 = 구매 불가, '취소' 입력 시 취소)"
  input-sell-price: "&e판매 가격을 채팅으로 입력하세요. &7(-1 = 판매 불가, '취소' 입력 시 취소)"
  input-invalid: "&c숫자만 입력해주세요."
  input-cancelled: "&7입력을 취소했습니다."
  buy-price-set: "&a구매 가격을 설정했습니다: &f{price}"
  sell-price-set: "&a판매 가격을 설정했습니다: &f{price}"

  # ── 페이지 / 리로드 ──
  pages-set: "&a상점 최대 페이지를 &e{page}페이지&a로 설정했습니다."
  pages-usage: "&c사용법: /상점관리 페이지 <1~100>"
  pages-hidden-warning: "&e주의: 줄어든 페이지에 있던 상품 {count}개는 보이지 않게 되었습니다. (데이터는 유지되며, 페이지를 다시 늘리면 복구됩니다)"
  reloaded: "&a설정과 상점 데이터를 다시 불러왔습니다."

  # /상점관리 도움말 (잘못된 명령어 입력 시 표시)
  admin-help:
    - "&8&m────────&8[ &6상점 관리 &8]&m────────"
    - "&e/상점관리 설정 &7─ 상점 편집 UI를 엽니다."
    - "&e/상점관리 페이지 <번호> &7─ 상점 최대 페이지를 설정합니다."
    - "&e/상점관리 리로드 &7─ 설정 파일을 다시 불러옵니다."
